# Local development PostgreSQL for the CareWeave backend (P2).
#
# All credentials are supplied via environment variables (from your .env
# file, or the shell) — nothing is hardcoded here, and nothing here is
# intended for production use.
#
# Usage:
#   cp .env.example .env      # then edit values as needed
#   docker compose up -d
#   docker compose down       # stop (data persists in the named volume)
#   docker compose down -v    # stop AND delete the database volume

services:
  postgres:
    image: postgres:16-alpine
    container_name: careweave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careweave}
      POSTGRES_USER: ${POSTGRES_USER:-careweave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - careweave_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careweave} -d ${POSTGRES_DB:-careweave}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  careweave_postgres_data:
    name: careweave_postgres_data
